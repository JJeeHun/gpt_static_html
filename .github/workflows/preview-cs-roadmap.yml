name: Preview CS Roadmap

on:
  push:
    branches:
      - feature/cs-roadmap-reference

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare CS roadmap preview
        shell: bash
        run: |
          mkdir -p src/cs-roadmap
          cp reference/cs-roadmap/mockup/index.html src/cs-roadmap/index.html
          rm -rf src/cs-roadmap/data
          cp -R reference/cs-roadmap/data src/cs-roadmap/data

          SHORT_SHA="${GITHUB_SHA::7}"
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          cat > src/cs-roadmap/build-info.json <<EOF
          {
            "branch": "$GITHUB_REF_NAME",
            "environment": "feature",
            "label": "FEATURE",
            "commit": "$SHORT_SHA",
            "deployedAt": "$DEPLOYED_AT"
          }
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./src

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
